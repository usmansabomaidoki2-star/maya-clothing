<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAYA CLOTHING - Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f6f8;
    }

    .admin-page {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .admin-header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .admin-header p {
      margin: 5px 0 0;
      opacity: .8;
    }

    .admin-btn {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn {
      background: #fff;
      color: #111;
    }

    .login-box {
      max-width: 430px;
      margin: 70px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .login-box label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      background: #111;
      color: white;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .error {
      background: #fff0ee;
      color: #b42318;
    }

    .success {
      background: #eaf8ef;
      color: #16803c;
    }

    #dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .stat-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #666;
    }

    .stat-card strong {
      font-size: 24px;
    }

    .orders-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }

    .orders-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .orders-top h2 {
      margin: 0;
    }

    .refresh-btn {
      background: #111;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f7f7;
    }

    .status-select {
      padding: 7px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .view-btn {
      background: #111;
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .close-modal {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .customer-info {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      line-height: 1.8;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .admin-page {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginSection" class="login-box">

    <h1>MAYA CLOTHING</h1>

    <p>Admin Login</p>

    <form id="loginForm">

      <label for="adminEmail">Email</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin email"
        required
      >

      <label for="adminPassword">Password</label>

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        class="admin-btn login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboard">

    <div class="admin-page">

      <header class="admin-header">

        <div>
          <h1>MAYA CLOTHING</h1>
          <p>Admin Dashboard</p>
        </div>

        <button
          id="logoutBtn"
          class="admin-btn logout-btn"
        >
          Logout
        </button>

      </header>


      <!-- STATISTICS -->
      <div class="stats">

        <div class="stat-card">
          <h3>Total Orders</h3>
          <strong id="totalOrders">0</strong>
        </div>

        <div class="stat-card">
          <h3>Pending</h3>
          <strong id="pendingOrders">0</strong>
        </div>

        <div class="stat-card">
          <h3>Processing</h3>
          <strong id="processingOrders">0</strong>
        </div>

        <div class="stat-card">
          <h3>Delivered</h3>
          <strong id="deliveredOrders">0</strong>
        </div>

        <div class="stat-card">
          <h3>Total Sales</h3>
          <strong id="totalSales">₦0</strong>
        </div>

      </div>


      <!-- ORDERS -->
      <div class="orders-box">

        <div class="orders-top">

          <h2>Orders</h2>

          <button
            id="refreshOrdersBtn"
            class="admin-btn refresh-btn"
          >
            Refresh
          </button>

        </div>

        <div id="ordersMessage" class="message"></div>

        <table>

          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="ordersTableBody">
          </tbody>

        </table>

      </div>

    </div>

  </section>


  <!-- ORDER DETAILS MODAL -->
  <div id="orderModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2 id="modalOrderTitle">
          Order Details
        </h2>

        <button
          id="closeModalBtn"
          class="close-modal"
        >
          ×
        </button>

      </div>

      <div id="orderDetails">
      </div>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ADMIN JAVASCRIPT -->
  <script src="admin.js"></script>

</body>
</html>
