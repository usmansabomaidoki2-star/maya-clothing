<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAYA CLOTHING</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .cart-btn {
      background: white;
      color: #111827;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    .shop-btn {
      border: none;
      background: white;
      color: #111827;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .categories button {
      white-space: nowrap;
      border: 1px solid #ddd;
      background: white;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin: 8px 0;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
      margin-left: 5px;
    }

    .stock {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }

    footer {
      margin-top: 50px;
      padding: 25px;
      background: #111827;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">MAYA CLOTHING</div>

  <button class="cart-btn">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>MAYA CLOTHING</h1>
  <p>Fashion • Style • Quality</p>

  <button class="shop-btn" onclick="scrollToShop()">
    Shop Now
  </button>
</section>

<main class="container" id="shop">

  <input
    type="search"
    id="search"
    class="search"
    placeholder="Search products..."
    oninput="searchProducts()"
  >

  <div id="categories" class="categories">
    Loading categories...
  </div>

  <div id="products" class="products">
    <div class="loading">
      Loading products...
    </div>
  </div>

</main>

<footer>
  <p>© 2026 MAYA CLOTHING</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=1"></script>

</body>
</html>
